name: Shizzi Comptes 0.1.1 router battery

on:
  push:
    branches: [feature/shizzi-comptes-0.1.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounts-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets are incomplete."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test and build signed Shizzi Comptes
        run: ./gradlew -PshizziAccountsOnly=true :accounts:testDebugUnitTest :accounts:lintDebug :accounts:assembleRelease :accounts:assembleDebugAndroidTest --no-daemon

      - name: Verify package, version and permanent certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          APK=accounts/build/outputs/apk/release/accounts-release.apk

          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          if [ "$PACKAGE" != "dev.shizzi.accounts" ]; then
            echo "::error::Expected package dev.shizzi.accounts, got $PACKAGE"
            exit 1
          fi
          if [ "$VERSION_NAME" != "0.1.1" ]; then
            echo "::error::Expected Comptes version 0.1.1, got $VERSION_NAME"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK"             | sed -n 's/^.*certificate SHA-256 digest: //p'             | head -1 | tr '[:lower:]' '[:upper:]')
          ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ': ')
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')

          if [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
            echo "::error::Signing certificate mismatch."
            exit 1
          fi

          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test "$VERSION_CODE" = "2"

          echo "Shizzi Comptes signed APK verified: package=$PACKAGE version=$VERSION_NAME certificate=$ACTUAL"

      - name: Prepare signed test artifact
        run: |
          mkdir -p accounts-output
          cp accounts/build/outputs/apk/release/accounts-release.apk accounts-output/Shizzi-Comptes-0.1.1.apk
          cd accounts-output
          sha256sum Shizzi-Comptes-0.1.1.apk > SHA256SUMS.txt

      - name: Upload signed Shizzi Comptes test APK
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Comptes-0.1.1
          path: |
            accounts-output/Shizzi-Comptes-0.1.1.apk
            accounts-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Comptes-0.1.1-test-reports
          path: |
            accounts/build/test-results/
            accounts/build/reports/
          if-no-files-found: warn

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties

  android-device:
    needs: admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify account cards and router battery on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew -PshizziClientsOnly=true :admin:assembleDebug --no-daemon
            adb install -r admin/build/outputs/apk/debug/admin-debug.apk
            ./gradlew -PshizziAccountsOnly=true :accounts:connectedDebugAndroidTest --no-daemon || { adb logcat -d > emulator-logcat.txt; exit 1; }
            adb install -r accounts/build/outputs/apk/debug/accounts-debug.apk
            adb shell pm path dev.shizzi.admin
            adb shell pm path dev.shizzi.accounts
      - name: Upload Android UI results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Comptes-0.1.1-ui-reports
          path: |
            accounts/build/outputs/androidTest-results/
            accounts/build/reports/androidTests/
            emulator-logcat.txt
          if-no-files-found: warn
