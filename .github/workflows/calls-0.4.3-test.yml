name: Shizzi 0.4.3 Calls test

on:
  push:
    branches: [test/calls-0.4.3.9]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizzi-043-calls-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-calls-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Virtual call signaling isolation and lifecycle
        run: ./gradlew :app:testDebugUnitTest --tests dev.shizzi.CallSignalingHubTest --no-daemon

      - name: Virtual local-only WebRTC UI contract
        run: ./gradlew :app:testDebugUnitTest --tests dev.shizzi.MessagingCallWebUiTest --no-daemon

      - name: Virtual Android secure call origin and native bridge
        run: ./gradlew :conso:testDebugUnitTest --tests dev.shizzi.conso.SecureChatWebSupportTest --no-daemon

      - name: Native ringtone and ringback contract
        run: |
          grep -q 'fun startIncomingRingtone' conso/src/main/java/dev/shizzi/conso/MainActivity.kt
          grep -q 'fun startOutgoingRingback' conso/src/main/java/dev/shizzi/conso/MainActivity.kt
          grep -q 'fun stopCallTone' conso/src/main/java/dev/shizzi/conso/MainActivity.kt
          grep -q 'RingtoneManager.TYPE_RINGTONE' conso/src/main/java/dev/shizzi/conso/MainActivity.kt
          grep -q 'ToneGenerator.TONE_SUP_RINGTONE' conso/src/main/java/dev/shizzi/conso/MainActivity.kt

      - name: Messaging regression
        run: ./gradlew :app:testDebugUnitTest --tests dev.shizzi.MessagingStoreTest --no-daemon

      - name: Offline Shizzi+ Media fullscreen regression
        run: ./gradlew :conso:testDebugUnitTest --tests dev.shizzi.conso.LocalMediaWebSupportTest --no-daemon

      - name: Shizzi+ resumable download range tests
        run: ./gradlew :app:testDebugUnitTest --tests dev.shizzi.ClientAppDownloadRangeTest --no-daemon

      - name: Direct 192.0.2.1 Shizzi+ download tests
        run: cd datapath && go test -run '^(TestClientAppDownloadUsesNativeBrowserStreaming|TestClientAppDownloadScriptIsNotInjectedWithoutDownloadLink|TestPortalShowsDirect192DownloadLink|TestShizziPlusDownloadPathVariants|TestTrailingSlashShizziPlusDownloadNeverFallsBackToPortalHTML|TestDirectShizziPlusAliasForwardsRangeAndStreamsResponse|TestClientAppDownloadProxyReturnsCompleteAPK)$' ./...

      - name: Virtual automatic hotspot startup regression
        run: ./gradlew :app:testDebugUnitTest --tests dev.shizzi.DownstreamStartupTest --no-daemon

      - name: Virtual Media access regression from 1 to 8 clients
        run: ./gradlew :app:testDebugUnitTest --tests dev.shizzi.MediaFolderAccessTest --no-daemon

      - name: Secure messaging proxy tests
        run: cd datapath && go test -run '^(TestAuthenticatedChatRequestReachesLoopbackBackend|TestUnauthenticatedChatNeverReachesBackend)$' ./...

      - name: Secured Media proxy regression
        run: cd datapath && go test -run '^TestAuthenticatedMediaRequestReachesLoopbackBackend$' ./...

      - name: Build signed Shizzi router, embedded Shizzi+ and Admin
        run: ./gradlew :app:assembleRelease :admin:assembleRelease --no-daemon

      - name: Verify versions and permanent certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')

          APK=app/build/outputs/apk/release/app-release.apk
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "dev.shizzi"
          test "$VERSION_NAME" = "0.4.3.9"
          test "$VERSION_CODE" = "21"
          ROUTER_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          test "$ROUTER_CERT" = "$EXPECTED_NORM"

          CONSO=conso/build/outputs/apk/release/conso-release.apk
          CONSO_BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$CONSO")
          CONSO_PACKAGE=$(echo "$CONSO_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          CONSO_VERSION=$(echo "$CONSO_BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CONSO_CODE=$(echo "$CONSO_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test "$CONSO_PACKAGE" = "dev.shizzi.conso"
          test "$CONSO_VERSION" = "0.2.9-test"
          test "$CONSO_CODE" = "13"
          CONSO_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$CONSO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          test "$CONSO_CERT" = "$EXPECTED_NORM"

          ADMIN=admin/build/outputs/apk/release/admin-release.apk
          ADMIN_BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$ADMIN")
          ADMIN_PACKAGE=$(echo "$ADMIN_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          ADMIN_VERSION=$(echo "$ADMIN_BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          ADMIN_CODE=$(echo "$ADMIN_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test "$ADMIN_PACKAGE" = "dev.shizzi.admin"
          test "$ADMIN_VERSION" = "0.2.5-test"
          test "$ADMIN_CODE" = "7"
          ADMIN_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$ADMIN" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          test "$ADMIN_CERT" = "$EXPECTED_NORM"

          EMBEDDED=/tmp/shizzi-plus-embedded.apk
          unzip -p "$APK" assets/shizzi/Shizzi-Plus.apk > "$EMBEDDED"
          test -s "$EMBEDDED"
          EMBEDDED_BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$EMBEDDED")
          EMBEDDED_VERSION=$(echo "$EMBEDDED_BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          EMBEDDED_CODE=$(echo "$EMBEDDED_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test "$EMBEDDED_VERSION" = "0.2.9-test"
          test "$EMBEDDED_CODE" = "13"
          EMBEDDED_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$EMBEDDED" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          test "$EMBEDDED_CERT" = "$EXPECTED_NORM"

      - name: Prepare test artifacts
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/Shizzi-Hotspot-0.4.3.9-Calls-Test.apk
          cp conso/build/outputs/apk/release/conso-release.apk release-output/Shizzi-Plus-0.2.9-Calls-Ringtone-Test.apk
          cp admin/build/outputs/apk/release/admin-release.apk release-output/Shizzi-Admin-0.2.5-Test.apk
          cd release-output
          sha256sum Shizzi-Hotspot-0.4.3.9-Calls-Test.apk Shizzi-Plus-0.2.9-Calls-Ringtone-Test.apk Shizzi-Admin-0.2.5-Test.apk > SHA256SUMS.txt

      - name: Upload signed calls test APKs
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-0.4.3-calls-test
          path: |
            release-output/Shizzi-Hotspot-0.4.3.9-Calls-Test.apk
            release-output/Shizzi-Plus-0.2.9-Calls-Ringtone-Test.apk
            release-output/Shizzi-Admin-0.2.5-Test.apk
            release-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
