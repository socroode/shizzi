name: ShizziCam monitor and measured LAN throughput (test branch)
on:
  push:
    branches:
      - feat/shizzicam-0.4.3.5.17-stream-audio-monitor
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
      - name: Test shizzicam datapath
        working-directory: datapath
        run: go test -count=1 ./...
  monitor-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile monitor and run unit tests
        run: ./gradlew -PshizziClientsOnly=true :cammonitor:testDebugUnitTest :cammonitor:assembleDebug :conso:testDebugUnitTest :conso:assembleDebug :camadmin:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ShizziCam-Debit-DEBUG-UNSIGNED-NOT-FOR-CLIENTS
          path: cammonitor/build/outputs/apk/debug/cammonitor-debug.apk
