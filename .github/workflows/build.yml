# Debug build and checks on every push and pull request.
#
# Does not sign anything and needs no secrets, so it runs unchanged on forks.
# app/build.gradle.kts already guards every keystore read, so the absence of
# keystore.properties here is the supported path rather than a special case.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHIZZI_KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 }}
      SHIZZI_STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD }}
      SHIZZI_KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS }}
      SHIZZI_KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Matches the toolchain line in datapath/go.mod. Pinned rather than
          # left to auto-download so a CI build uses the same compiler the
          # release does.
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        # Pinned to AGP 8.7.3's default. android.ndkDirectory otherwise
        # resolves to whatever the runner happens to ship, which changes the
        # toolchain the datapath is compiled with between runs.
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        # The gomobileBind task looks for the binary at ~/go/bin specifically,
        # so installing it anywhere else on PATH is not enough.
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test datapath
        # Runs on the host, not under the NDK: an android/arm64 test binary
        # would not execute on this runner. bind.go is tagged android-only and
        # stubbed elsewhere precisely so the package builds here.
        run: cd datapath && go test ./...

      - name: Vet datapath
        # Also vet the real Android build. The stub means a host-only check
        # would never look at bind.go, which is the one file that can break on
        # a toolchain the tests do not use.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cd datapath
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC" go vet ./...

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare permanent release signing
        if: ${{ env.SHIZZI_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          printf '%s' "$SHIZZI_KEYSTORE_B64" | base64 --decode > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$SHIZZI_STORE_PASSWORD
          keyAlias=$SHIZZI_KEY_ALIAS
          keyPassword=$SHIZZI_KEY_PASSWORD
          EOF

      - name: Verify permanent signing identity
        if: ${{ env.SHIZZI_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          EXPECTED_SHA256="1F:6D:2E:EF:58:BF:9C:40:F0:9B:51:55:C9:CA:5F:CC:D4:AD:1F:C8:44:73:E9:B0:66:CC:FD:4F:9B:40:30:6B"
          ACTUAL_SHA256="$(keytool -list -v \
            -keystore shizzi-release.jks \
            -storepass "$SHIZZI_STORE_PASSWORD" \
            -alias "$SHIZZI_KEY_ALIAS" \
            | awk '/SHA256:/{print $2; exit}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "Unexpected Shizzi signing certificate: $ACTUAL_SHA256"
            exit 1
          }

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload permanently signed release APK
        if: ${{ env.SHIZZI_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: shizzi-v1.1.2-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload unsigned release APK fallback
        if: ${{ env.SHIZZI_KEYSTORE_B64 == '' }}
        uses: actions/upload-artifact@v5
        with:
          name: shizzi-v1.1.2-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Remove signing material
        if: ${{ always() && env.SHIZZI_KEYSTORE_B64 != '' }}
        shell: bash
        run: rm -f shizzi-release.jks keystore.properties

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
