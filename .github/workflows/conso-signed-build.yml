name: Shizzi Conso signed test APK

on:
  push:
    branches: [build/shizzi-conso-signed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conso-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets are incomplete."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed Shizzi Conso release APK
        run: ./gradlew :conso:assembleRelease --no-daemon

      - name: Verify package, version and permanent certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          APK=conso/build/outputs/apk/release/conso-release.apk

          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          if [ "$PACKAGE" != "dev.shizzi.conso" ]; then
            echo "::error::Expected package dev.shizzi.conso, got $PACKAGE"
            exit 1
          fi
          if [ "$VERSION_NAME" != "0.1.0" ]; then
            echo "::error::Expected Conso version 0.1.0, got $VERSION_NAME"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK"             | sed -n 's/^.*certificate SHA-256 digest: //p'             | head -1 | tr '[:lower:]' '[:upper:]')
          ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ': ')
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')

          if [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
            echo "::error::Signing certificate mismatch."
            exit 1
          fi

          echo "Shizzi Conso signed APK verified: package=$PACKAGE version=$VERSION_NAME certificate=$ACTUAL"

      - name: Prepare signed test artifact
        run: |
          mkdir -p conso-output
          cp conso/build/outputs/apk/release/conso-release.apk conso-output/Shizzi-Conso-0.1.0-signed-test.apk
          cd conso-output
          sha256sum Shizzi-Conso-0.1.0-signed-test.apk > SHA256SUMS.txt

      - name: Upload signed Shizzi Conso test APK
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Conso-0.1.0-signed-test
          path: |
            conso-output/Shizzi-Conso-0.1.0-signed-test.apk
            conso-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
