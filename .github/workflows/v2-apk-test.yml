name: Shizzi V2 APK testing package

on:
  push:
    branches:
      - rebuild/shizzi-v2
    paths:
      - '.github/workflows/v2-apk-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizzi-v2-test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-update-test:
    name: Signed test APK (upgrade existing Shizzi)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: datapath/go.mod
          cache-dependency-path: datapath/go.sum
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - name: Install gomobile
        working-directory: datapath
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore EXISTING release signing key from GitHub secrets
        env:
          KS_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KS_B64" || -z "$KS_STORE_PASS" || -z "$KS_ALIAS" || -z "$KS_KEY_PASS" ]]; then
            echo "::error::The permanent Shizzi release keystore/passwords are unavailable. Never use a debug key to update an installed 0.4.3.5.3."
            exit 1
          fi
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > shizzi-release.jks
          {
            printf 'storeFile=shizzi-release.jks\n'
            printf 'storePassword=%s\n' "$KS_STORE_PASS"
            printf 'keyAlias=%s\n' "$KS_ALIAS"
            printf 'keyPassword=%s\n' "$KS_KEY_PASS"
          } > keystore.properties
          test -s shizzi-release.jks
      - name: Build signed release for Shizzi, Plus and Admin (no publication)
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify package, versionCode and permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- '-rc' | sort -V | tail -1)"
          CERT_EXPECTED="$(printf '%s' 'FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          mkdir -p test-apks-signed
          for spec in 'app:Shizzi-V2-0.5.0-alpha.1-SIGNED.apk:dev.shizzi:32' 'conso:Shizzi-Plus-SIGNED.apk:dev.shizzi.conso:14' 'admin:Shizzi-Admin-SIGNED.apk:dev.shizzi.admin:11'; do
            IFS=: read -r module filename package expectedCode <<< "$spec"
            apk="$module/build/outputs/apk/release/$module-release.apk"
            test -s "$apk"
            info="$("$BUILD_TOOLS/aapt" dump badging "$apk" | head -1)"
            echo "$info"
            [[ "$info" == *"name='$package'"* ]] || { echo "::error::Unexpected Android package id in $apk"; exit 1; }
            [[ "$info" == *"versionCode='$expectedCode'"* ]] || { echo "::error::Unexpected versionCode in $apk"; exit 1; }
            signature="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
            cert="$(printf '%s\n' "$signature" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' | head -1 | tr '[:upper:]' '[:lower:]')"
            if [[ "$cert" != "$CERT_EXPECTED" ]]; then
              echo "::error::Certificate mismatch in $apk. Refusing to deliver an incompatible APK."
              exit 1
            fi
            cp "$apk" "test-apks-signed/$filename"
          done
          (cd test-apks-signed && sha256sum *.apk > SHA256SUMS.txt)
          echo 'Verified original certificate for all 3 APKs and Android update identifiers.'
      - name: Upload signed Shizzi V2 test APKs (not a GitHub release)
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-V2-SIGNED-update-test
          path: test-apks-signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Destroy temporary signing files
        if: always()
        run: rm -f shizzi-release.jks keystore.properties

  debug-clean-install-only:
    name: Debug APK (only for spare phone with no existing Shizzi)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: datapath/go.mod
          cache-dependency-path: datapath/go.sum
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - name: Install gomobile
        working-directory: datapath
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble isolated debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Check package version
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -F 'applicationId = "dev.shizzi"' app/build.gradle.kts
          grep -F 'versionCode = 32' app/build.gradle.kts
      - name: Upload debug APK for clean-install device only
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-V2-DEBUG-CLEAN-INSTALL-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
