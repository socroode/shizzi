name: Shizzi Admin input-safe refresh build

on:
  push:
    branches: [build/admin-input-safe-refresh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Test Shizzi Admin
        run: ./gradlew :admin:testDebugUnitTest --no-daemon
      - name: Build signed Shizzi Admin
        run: ./gradlew :admin:assembleRelease --no-daemon
      - name: Verify package version and certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          APK=admin/build/outputs/apk/release/admin-release.apk
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "dev.shizzi.admin"
          test "$VERSION" = "0.2.10-test"
          test "$CODE" = "12"
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')
          test "$(echo "$ACTUAL" | tr -d ': ')" = "$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')"
      - name: Prepare artifact
        run: |
          mkdir -p admin-output
          cp admin/build/outputs/apk/release/admin-release.apk admin-output/Shizzi-Admin-0.2.10-input-safe-refresh.apk
          sha256sum admin-output/Shizzi-Admin-0.2.10-input-safe-refresh.apk > admin-output/SHA256SUMS.txt
      - name: Upload signed Admin APK
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Admin-0.2.10-input-safe-refresh
          path: |
            admin-output/Shizzi-Admin-0.2.10-input-safe-refresh.apk
            admin-output/SHA256SUMS.txt
      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
