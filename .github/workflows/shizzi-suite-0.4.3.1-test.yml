name: Shizzi 0.4.3.5 suite test

on:
  push:
    branches: [feature/media-0.4.3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizzi-suite-0435-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test datapath
        run: cd datapath && go test ./...

      - name: Vet datapath
        run: cd datapath && go vet ./...

      - name: Test Android core
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed Shizzi suite
        run: ./gradlew :app:assembleRelease :conso:assembleRelease :admin:assembleRelease --no-daemon

      - name: Verify packages, versions and certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')

          verify_apk() {
            APK="$1"
            EXPECTED_PACKAGE="$2"
            EXPECTED_VERSION="$3"
            EXPECTED_CODE="$4"
            BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
            PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            test "$PACKAGE" = "$EXPECTED_PACKAGE"
            test "$VERSION_NAME" = "$EXPECTED_VERSION"
            test "$VERSION_CODE" = "$EXPECTED_CODE"
            ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')
            ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ': ')
            test "$ACTUAL_NORM" = "$EXPECTED_NORM"
          }

          verify_apk app/build/outputs/apk/release/app-release.apk dev.shizzi 0.4.3.5 15
          verify_apk conso/build/outputs/apk/release/conso-release.apk dev.shizzi.conso 0.2.3 7
          verify_apk admin/build/outputs/apk/release/admin-release.apk dev.shizzi.admin 0.2.3 5

      - name: Prepare suite artifacts
        run: |
          mkdir -p suite-output
          cp app/build/outputs/apk/release/app-release.apk suite-output/Shizzi-Hotspot-0.4.3.5-Media-Test.apk
          cp conso/build/outputs/apk/release/conso-release.apk suite-output/Shizzi-Plus-0.2.3-Test.apk
          cp admin/build/outputs/apk/release/admin-release.apk suite-output/Shizzi-Admin-0.2.3-Test.apk
          cd suite-output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload signed Shizzi suite
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-0.4.3.5-suite-test
          path: |
            suite-output/Shizzi-Hotspot-0.4.3.5-Media-Test.apk
            suite-output/Shizzi-Plus-0.2.3-Test.apk
            suite-output/Shizzi-Admin-0.2.3-Test.apk
            suite-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
