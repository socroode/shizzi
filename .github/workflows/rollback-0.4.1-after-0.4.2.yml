name: Shizzi 0.4.1 rollback after 0.4.2

on:
  push:
    branches: [rollback/0.4.1-after-0.4.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizzi-041-rollback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify 0.4.1 runtime restored
        run: |
          git diff --exit-code 562c54bab5992145f1b95803d63d39eae444380c --             app/src/main/java/dev/shizzi/CybercafeTrafficBridge.kt             app/src/main/java/dev/shizzi/SessionService.kt             app/src/main/java/dev/shizzi/ui/CybercafeAdminPage.kt             datapath/portal.go             datapath/traffic.go
          ! grep -R -q "/api/v1/admin" datapath app/src/main/java/dev/shizzi
          ! grep -q 'include(":admin")' settings.gradle.kts
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "0.4.1-rollback1"' app/build.gradle.kts

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets are incomplete."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test datapath
        run: cd datapath && go test ./...

      - name: Race test datapath
        run: cd datapath && go test -race ./...

      - name: Vet datapath
        run: cd datapath && go vet ./...

      - name: Test migration compatibility
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed rollback APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify rollback package, version and certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")

          test "$PACKAGE" = "dev.shizzi"
          test "$VERSION_NAME" = "0.4.1-rollback1"
          test "$VERSION_CODE" = "10"
          test "$VERSION_CODE" -gt 9

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK"             | sed -n 's/^.*certificate SHA-256 digest: //p'             | head -1 | tr '[:lower:]' '[:upper:]')
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')
          ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ': ')
          test "$ACTUAL_NORM" = "$EXPECTED_NORM"

      - name: Prepare rollback artifact
        run: |
          mkdir -p rollback-output
          cp app/build/outputs/apk/release/app-release.apk rollback-output/Shizzi-Hotspot-0.4.1-rollback1-vc10.apk
          cd rollback-output
          sha256sum Shizzi-Hotspot-0.4.1-rollback1-vc10.apk > SHA256SUMS.txt

      - name: Upload signed rollback APK
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-0.4.1-rollback-after-0.4.2
          path: |
            rollback-output/Shizzi-Hotspot-0.4.1-rollback1-vc10.apk
            rollback-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
