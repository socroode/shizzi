name: Sign Shizzi Gateway 0.0.0.1 with permanent key

on:
  push:
    branches: [build/sign-gateway-0.0.0.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizzi-gateway-0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tests deliberately run before signing/building the APK.
      - name: Test datapath and module gating
        run: cd datapath && go test ./...

      - name: Vet datapath
        run: cd datapath && go vet ./...

      - name: Test Android module persistence
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint Shizzi and Shizzi+
        run: ./gradlew :app:lintDebug :conso:lintDebug --no-daemon

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets are incomplete in socroode/shizzi."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APKs after tests
        run: ./gradlew :app:assembleRelease :conso:assembleRelease :admin:assembleRelease --no-daemon

      - name: Verify versions signatures and embedded Shizzi+
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')

          verify_apk() {
            APK="$1"
            EXPECTED_PACKAGE="$2"
            EXPECTED_VERSION="$3"
            EXPECTED_CODE="$4"

            BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
            PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")

            test "$PACKAGE" = "$EXPECTED_PACKAGE"
            test "$VERSION_NAME" = "$EXPECTED_VERSION"
            test "$VERSION_CODE" = "$EXPECTED_CODE"

            "$BUILD_TOOLS/apksigner" verify "$APK"
            ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" |
              sed -n 's/^.*certificate SHA-256 digest: //p' |
              head -1 | tr '[:lower:]' '[:upper:]')
            ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ': ')
            test "$ACTUAL_NORM" = "$EXPECTED_NORM"
          }

          ROUTER_APK=app/build/outputs/apk/release/app-release.apk
          PLUS_APK=conso/build/outputs/apk/release/conso-release.apk
          ADMIN_APK=admin/build/outputs/apk/release/admin-release.apk

          verify_apk "$ROUTER_APK" dev.shizzi 0.0.0.1 27
          verify_apk "$PLUS_APK" dev.shizzi.conso 0.3.1-gateway-test 15
          verify_apk "$ADMIN_APK" dev.shizzi.admin 0.2.3 5

          unzip -p "$ROUTER_APK" assets/shizzi/Shizzi-Plus.apk > /tmp/Shizzi-Plus-embedded.apk
          test "$(stat -c%s /tmp/Shizzi-Plus-embedded.apk)" -gt 20000
          unzip -t /tmp/Shizzi-Plus-embedded.apk >/dev/null
          cmp "$PLUS_APK" /tmp/Shizzi-Plus-embedded.apk
          verify_apk /tmp/Shizzi-Plus-embedded.apk dev.shizzi.conso 0.3.1-gateway-test 15

      - name: Prepare test artifacts
        run: |
          set -euo pipefail
          mkdir -p gateway-output
          cp app/build/outputs/apk/release/app-release.apk gateway-output/Shizzi-Gateway-0.0.0.1-Modules-Test.apk
          cp conso/build/outputs/apk/release/conso-release.apk gateway-output/Shizzi-Plus-0.3.1-Gateway-Compatible.apk
          cp admin/build/outputs/apk/release/admin-release.apk gateway-output/Shizzi-Admin-0.2.3.apk
          cd gateway-output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload signed test APKs
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Gateway-0.0.0.1-modules-test
          path: |
            gateway-output/Shizzi-Gateway-0.0.0.1-Modules-Test.apk
            gateway-output/Shizzi-Plus-0.3.1-Gateway-Compatible.apk
            gateway-output/Shizzi-Admin-0.2.3.apk
            gateway-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
