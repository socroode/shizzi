name: Shizzi 0.4.3.5.10.2 account coupon validation
on:
  push:
    branches: [feature/0.4.3.5.10.1-admin-coupons]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: datapath/go.mod
          cache-dependency-path: datapath/go.sum
      - uses: android-actions/setup-android@v4
      - name: Install pinned NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - name: Install gomobile
        working-directory: datapath
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init
      - uses: gradle/actions/setup-gradle@v6
      - name: Go regression tests
        run: cd datapath && go test ./...
      - name: Restore permanent signing
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Test Android modules
        run: ./gradlew :app:testDebugUnitTest :admin:testDebugUnitTest :conso:testDebugUnitTest --no-daemon
      - name: Build signed router with embedded client APKs
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify versions signatures and embedded APK integrity
        env:
          EXPECTED_CERT: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- '-rc' | sort -V | tail -1)
          mkdir -p verified-apks
          for item in "app:dev.shizzi:0.4.3.5.10.2:40" "admin:dev.shizzi.admin:0.3.4-coupons:19" "conso:dev.shizzi.conso:0.3.0-background-calls:17"; do
            IFS=: read -r module package expected_name expected_code <<< "$item"
            APK="$module/build/outputs/apk/release/$module-release.apk"
            test -s "$APK"
            test "$(stat -c%s "$APK")" -gt 20000
            unzip -t "$APK" >/dev/null
            BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
            echo "$BADGING" | head -1 | grep -F "name='$package'" | grep -F "versionCode='$expected_code'" | grep -F "versionName='$expected_name'"
            CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
            EXPECTED=$(echo "$EXPECTED_CERT" | tr -d ': ')
            test "$CERT" = "$EXPECTED"
            cp "$APK" "verified-apks/Shizzi-$module-$expected_name.apk"
          done
          unzip -p app/build/outputs/apk/release/app-release.apk assets/shizzi/Shizzi-Admin.apk >/tmp/shizzi-embedded-admin.apk
          unzip -p app/build/outputs/apk/release/app-release.apk assets/shizzi/Shizzi-Plus.apk >/tmp/shizzi-embedded-plus.apk
          cmp /tmp/shizzi-embedded-admin.apk admin/build/outputs/apk/release/admin-release.apk
          cmp /tmp/shizzi-embedded-plus.apk conso/build/outputs/apk/release/conso-release.apk
          (cd verified-apks && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload verified APKs
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-0.4.3.5.10.2-coupons-signed
          path: verified-apks/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-0.4.3.5.10.2-test-reports
          path: |
            app/build/test-results/
            admin/build/test-results/
            conso/build/test-results/
          if-no-files-found: warn
      - name: Erase signing materials
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
