name: ShizziCam Visionneuse only - signed toggle intercom
on:
  push:
    branches:
      - fix/shizzicam-viewer-0.3.3-toggle-mic
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore permanent APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Only compile and test the ShizziCam viewer APK
        run: ./gradlew -PshizziClientsOnly=true :camadmin:testDebugUnitTest :camadmin:assembleRelease --no-daemon
      - name: Validate signed viewer identity and package
        env:
          EXPECTED_CERT: FADFC5E87FA60351F7DCB75D34F1AB91110824333CD1097A38B3C703F7AF3DB7
        run: |
          set -euo pipefail
          apk=camadmin/build/outputs/apk/release/camadmin-release.apk
          test -s "$apk"
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          badges=$("$tools/aapt" dump badging "$apk")
          grep -q "name='dev.shizzi.camadmin'" <<< "$badges"
          grep -q "versionName='0.3.3-toggle-intercom-test'" <<< "$badges"
          grep -q "versionCode='8'" <<< "$badges"
          "$tools/apksigner" verify "$apk"
          cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          test "$cert" = "$EXPECTED_CERT"
          mkdir -p viewer-test
          cp "$apk" viewer-test/ShizziCam-Visionneuse-0.3.3-toggle-intercom-test.apk
          cd viewer-test
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: ShizziCam-Visionneuse-ONLY-0.3.3-SIGNED-TEST
          path: viewer-test/
          retention-days: 30
          if-no-files-found: error
