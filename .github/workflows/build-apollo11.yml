name: Build Apollo 11 Houston APK
on:
  push:
    branches: ["feature/apollo11-houston-app"]
    paths: ["apollo11-sim/**", ".github/workflows/build-apollo11.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apollo11-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Apollo11-Houston-0.1.0-debug
          path: apollo11-sim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
