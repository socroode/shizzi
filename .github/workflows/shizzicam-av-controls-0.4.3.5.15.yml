name: ShizziCam 0.4.3.5.15 integrated cam audio controls and verified triplet
on:
  push:
    branches: [fix/shizzicam-0.4.3.5.15-audio-controls-distribution]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizzicam-triplet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: datapath/go.mod
          cache-dependency-path: datapath/go.sum
      - name: Format and test datapath
        run: |
          cd datapath
          gofmt -w portal.go traffic.go verified_client_download.go verified_client_download_test.go client_app_download_test.go client_app_download_e2e_test.go shizzicam.go shizzicam_rtc.go shizzicam_audio.go shizzicam_test.go shizzicam_rtc_test.go shizzicam_audio_test.go
          go vet ./...
          go test -count=1 -timeout=10m ./...

  signed-three-apks:
    needs: [go-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: datapath/go.mod
          cache-dependency-path: datapath/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - name: Install gomobile toolchain
        working-directory: datapath
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore existing permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ERROR: missing existing signing key"; exit 1; }
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Check relay-only media routing and viewer mosaic code
        run: |
          grep -q 'api/v1/cam/frame' conso/src/main/java/dev/shizzi/conso/CameraCaptureService.kt
          grep -q 'api/v1/cam/audio' conso/src/main/java/dev/shizzi/conso/CameraCaptureService.kt
          grep -q 'api/v1/cam/frame' camadmin/src/main/java/dev/shizzi/admin/CamAdminActivity.kt
          grep -q 'api/v1/cam/audio' camadmin/src/main/java/dev/shizzi/admin/CamAdminActivity.kt
          grep -q 'GridLayout' camadmin/src/main/java/dev/shizzi/admin/CamAdminActivity.kt
          ! grep -q 'CamPeer' conso/src/main/java/dev/shizzi/conso/CameraCaptureService.kt
          ! grep -q 'CamPeer' camadmin/src/main/java/dev/shizzi/admin/CamAdminActivity.kt
      - name: Android client/admin tests
        run: ./gradlew -PshizziClientsOnly=true :conso:testDebugUnitTest :admin:testDebugUnitTest :camrtc:assembleDebug :camadmin:assembleDebug --no-daemon
      - name: Build all three signed APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :camadmin:assembleRelease --no-daemon
      - name: Verify identity, versions, certificate, and bundled client
        env:
          EXPECTED_CERT: "FADFC5E87FA60351F7DCB75D34F1AB91110824333CD1097A38B3C703F7AF3DB7"
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          for row in \
            "app/build/outputs/apk/release/app-release.apk|dev.shizzi|0.4.3.5.15|46" \
            "conso/build/outputs/apk/release/conso-release.apk|dev.shizzi.conso|0.3.3.1-av-controls|23" \
            "camadmin/build/outputs/apk/release/camadmin-release.apk|dev.shizzi.camadmin|0.3.1-av-controls|6"; do
            IFS='|' read -r apk pkg version code <<< "$row"
            test -s "$apk"
            badging=$("$BUILD_TOOLS/aapt2" dump badging "$apk")
            echo "$badging" | head -2
            grep -q "name='$pkg'" <<< "$badging"
            grep -q "versionName='$version'" <<< "$badging"
            grep -q "versionCode='$code'" <<< "$badging"
            grep -q "minSdkVersion:'30'" <<< "$badging"
            cert=$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
            test "$cert" = "$EXPECTED_CERT"
          done
          unzip -p app/build/outputs/apk/release/app-release.apk assets/shizzi/Shizzi-Plus.apk > /tmp/shizzicam-embedded-plus.apk
          cmp /tmp/shizzicam-embedded-plus.apk conso/build/outputs/apk/release/conso-release.apk
          unzip -p app/build/outputs/apk/release/app-release.apk assets/shizzi/ShizziCam-Admin.apk > /tmp/shizzicam-embedded-viewer.apk
          cmp /tmp/shizzicam-embedded-viewer.apk camadmin/build/outputs/apk/release/camadmin-release.apk
          test -s /tmp/shizzicam-embedded-viewer.apk
          unzip -p app/build/outputs/apk/release/app-release.apk assets/shizzi/Shizzi-Admin.apk > /tmp/shizzicam-embedded-classic-admin.apk
          test -s /tmp/shizzicam-embedded-classic-admin.apk

      - name: Verify release WebRTC JNI class retention and Android 11 minimum
        run: |
          python3 - <<'PY'
          import zipfile, re
          for pkg in ["conso", "camadmin"]:
              path=f"{pkg}/build/outputs/apk/release/{pkg}-release.apk"
              with zipfile.ZipFile(path) as z:
                  data=b"".join(z.read(n) for n in z.namelist() if re.fullmatch(r"classes\d*\.dex",n))
              for symbol in (b"Lorg/webrtc/PeerConnectionFactory;",b"Lorg/webrtc/PeerConnection;",b"Lorg/webrtc/EglBase;",b"Lorg/webrtc/Camera2Enumerator;"):
                  assert symbol in data, f"{path}: JNI class missing {symbol.decode()}"
              print(path,"WebRTC JNI symbol retention: PASS")
          with zipfile.ZipFile("app/build/outputs/apk/release/app-release.apk") as z:
              size=z.getinfo("assets/shizzi/Shizzi-Plus.apk").file_size
          assert size < 128*1024*1024, "APK too large for bounded verified distribution"
          print("Signed embedded Shizzi+Cam distribution size:",size,"bytes")
          PY

      - name: Fail release if WebRTC JNI bridge class is absent from DEX
        run: |
          python3 scripts/verify_webrtc_jni_dex.py \
            conso/build/outputs/apk/release/conso-release.apk \
            camadmin/build/outputs/apk/release/camadmin-release.apk

      - name: Prepare only CI build artifacts (no release/publication)
        run: |
          mkdir -p shizzicam-output
          cp app/build/outputs/apk/release/app-release.apk shizzicam-output/ShizziCam-Hotspot-0.4.3.5.15.apk
          cp conso/build/outputs/apk/release/conso-release.apk shizzicam-output/Shizzi-PlusCam-0.3.3.1.apk
          cp camadmin/build/outputs/apk/release/camadmin-release.apk shizzicam-output/ShizziCam-Admin-0.3.1.apk
          cd shizzicam-output
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload three verified APKs
        uses: actions/upload-artifact@v5
        with:
          name: ShizziCam-0.4.3.5.15-AV-CONTROLS-TRIPLET-TEST
          path: shizzicam-output/
          if-no-files-found: error
          retention-days: 30
