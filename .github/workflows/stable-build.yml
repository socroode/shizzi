name: Stable signed APK

on:
  push:
    branches: [rebuild/shizzi-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIZZI_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIZZI_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIZZI_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIZZI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing secrets are incomplete."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > shizzi-release.jks
          cat > keystore.properties <<EOF
          storeFile=shizzi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test datapath
        run: cd datapath && go test ./...

      - name: Test Android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build stable release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify version and permanent certificate
        env:
          EXPECTED_CERT_SHA256: "FA:DF:C5:E8:7F:A6:03:51:F7:DC:B7:5D:34:F1:AB:91:11:08:24:33:3C:D1:09:7A:38:B3:C7:03:F7:AF:3D:B7"
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk

          VERSION_NAME=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$VERSION_NAME" != "0.4.0" ]; then
            echo "::error::Expected stable version 0.4.0, got $VERSION_NAME"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' \
            | head -1 | tr '[:lower:]' '[:upper:]')
          ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ': ')
          EXPECTED_NORM=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ')

          if [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
            echo "::error::Signing certificate mismatch."
            exit 1
          fi

          echo "Stable APK verified: version=$VERSION_NAME certificate=$ACTUAL"

      - name: Prepare stable artifact
        run: |
          mkdir -p stable-output
          cp app/build/outputs/apk/release/app-release.apk stable-output/Shizzi-Hotspot-0.4.0.apk
          cd stable-output
          sha256sum Shizzi-Hotspot-0.4.0.apk > SHA256SUMS.txt

      - name: Upload stable signed APK
        uses: actions/upload-artifact@v5
        with:
          name: Shizzi-Hotspot-0.4.0-stable
          path: |
            stable-output/Shizzi-Hotspot-0.4.0.apk
            stable-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f shizzi-release.jks keystore.properties
